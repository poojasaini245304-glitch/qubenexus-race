<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qubenexus Highway Racing - COMPLETE</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #000; color: #00d4ff; font-family: 'Arial', sans-serif; overflow: hidden; }
        #gameCanvas { display: block; }
        #joinScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 200; }
      .joinBox { background: linear-gradient(135deg, #1a1a1a, #0a0a0a); padding: 40px; border-radius: 20px; border: 3px solid #00d4ff; text-align: center; box-shadow: 0 0 50px #00d4ff80; }
      .joinBox h1 { margin-bottom: 20px; font-size: 3em; text-shadow: 0 0 30px #00d4ff; }
      .joinBox input { padding: 15px; font-size: 18px; background: #0a0a0a; border: 2px solid #00d4ff; color: #00d4ff; border-radius: 10px; margin: 10px; width: 280px; }
      .joinBox button { padding: 15px 50px; font-size: 22px; background: linear-gradient(45deg, #00d4ff, #00ffff); color: #000; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; }
      .carSelect { display: flex; gap: 15px; justify-content: center; margin: 20px 0; }
      .carOption { width: 90px; height: 70px; border: 3px solid #333; border-radius: 10px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; font-weight: bold; }
      .carOption.selected { border-color: #00d4ff; box-shadow: 0 0 25px #00d4ff; transform: scale(1.1); }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.9); padding: 15px; border-radius: 15px; border: 2px solid #00d4ff; }
        #leaderboard { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.9); padding: 15px; border-radius: 15px; border: 2px solid #ffd700; min-width: 220px; }
        #leaderboard h3 { color: #ffd700; margin-bottom: 10px; }
      .leaderboard-item { display: flex; justify-content: space-between; margin: 5px 0; padding: 6px; background: rgba(255,215,0,0.1); border-radius: 5px; }
        #voiceUI { position: absolute; top: 220px; right: 10px; background: rgba(0,0,0,0.9); padding: 15px; border-radius: 15px; border: 2px solid #00ff00; z-index: 100; min-width: 220px; }
        #voiceUI h3 { color: #00ff00; margin-bottom: 10px; }
      .voicePlayer { display: flex; align-items: center; gap: 8px; margin: 5px 0; padding: 6px; background: rgba(0,255,0,0.1); border-radius: 5px; }
      .speaking { animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%, 100% { background: rgba(0,255,0,0.3); box-shadow: 0 0 10px #00ff00; } 50% { background: rgba(0,255,0,0.6); box-shadow: 0 0 20px #00ff00; } }
        #chatBox { position: absolute; bottom: 140px; left: 10px; width: 380px; height: 220px; background: rgba(0,0,0,0.9); border: 2px solid #00d4ff; border-radius: 15px; z-index: 100; display: flex; flex-direction: column; }
        #chatMessages { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; }
        #chatMessages div { margin: 4px 0; padding: 5px; background: rgba(0,212,255,0.1); border-radius: 5px; word-wrap: break-word; }
        #chatInput { display: flex; border-top: 2px solid #00d4ff; }
        #chatInput input { flex: 1; background: #0a0a0a; border: none; color: #00d4ff; padding: 10px; font-size: 13px; }
        #chatInput button { background: #00d4ff; border: none; color: #000; padding: 10px 15px; cursor: pointer; font-weight: bold; }
        #mobileControls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; z-index: 100; }
      .controlBtn { width: 95px; height: 95px; background: rgba(0,212,255,0.5); border: 4px solid #00d4ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 38px; color: #00d4ff; cursor: pointer; box-shadow: 0 0 25px #00d4ff60; font-weight: bold; }
      .controlBtn:active { background: rgba(0,212,255,1); transform: scale(0.9); }
        #leftControls { display: flex; gap: 20px; }
        #rightControls { display: flex; gap: 15px; flex-direction: column; align-items: center; }
        #nitroBtn { background: rgba(255,0,102,0.5); border-color: #ff0066; color: #ff0066; width: 115px; height: 115px; box-shadow: 0 0 25px #ff006660; }
        #hornBtn { background: rgba(255,255,0,0.5); border-color: #ffff00; color: #ffff00; width: 75px; height: 75px; font-size: 32px; }
        #micBtn { background: rgba(0,255,0,0.5); border-color: #00ff00; color: #00ff00; width: 75px; height: 75px; font-size: 32px; }
        #micBtn.active { background: rgba(0,255,0,1); animation: micPulse 1s infinite; }
        @keyframes micPulse { 0%, 100% { box-shadow: 0 0 25px #00ff00; } 50% { box-shadow: 0 0 45px #00ff00; } }
      .nitro-bar { width: 150px; height: 18px; background: #333; border-radius: 10px; overflow: hidden; margin-top: 5px; border: 1px solid #555; }
      .nitro-fill { height: 100%; background: linear-gradient(90deg, #ff0066, #ff6600, #ffff00); }
        #soundBtn { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); border: 2px solid #00d4ff; color: #00d4ff; padding: 12px 25px; border-radius: 10px; cursor: pointer; z-index: 100; font-size: 16px; }
        #lapInfo { font-size: 20px; color: #ffd700; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="joinScreen">
        <div class="joinBox">
            <h1>🛣️ HIGHWAY RACER 🛣️</h1>
            <p style="font-size: 1.3em; margin-bottom: 15px; color: #00ff00;">🎤 Voice Chat + 4-Lane Highway!</p>
            <input type="text" id="playerName" placeholder="Enter Your Name" maxlength="15" value="Sneh">
            <p style="margin: 15px 0 5px 0;">Choose Your Car:</p>
            <div class="carSelect">
                <div class="carOption selected" data-car="f1" style="background: linear-gradient(45deg, #00d4ff, #0088ff);">F1</div>
                <div class="carOption" data-car="sport" style="background: linear-gradient(45deg, #ff0066, #ff3366);">SPORT</div>
                <div class="carOption" data-car="truck" style="background: linear-gradient(45deg, #ff6600, #ffaa00);">TRUCK</div>
            </div>
            <button onclick="startGame()">🏁 START RACE</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <button id="soundBtn" onclick="toggleSound()">🔊 Sound: ON</button>

    <div id="ui">
        <h3>🏁 HIGHWAY RACER</h3>
        <p>Speed: <span id="speed">0</span> km/h</p>
        <p id="lapInfo">Lap: <span id="lap">0</span>/3</p>
        <p>Nitro:</p>
        <div class="nitro-bar"><div class="nitro-fill" id="nitroFill" style="width: 100%"></div></div>
    </div>

    <div id="leaderboard">
        <h3>🏆 LEADERBOARD</h3>
        <div id="leaderboardList"></div>
    </div>

    <div id="voiceUI">
        <h3>🎤 Voice Chat</h3>
        <div id="voicePlayers"></div>
        <button onclick="toggleMic()" id="micToggle" style="width: 100%; margin-top: 10px; padding: 10px; background: #00ff00; border: none; border-radius: 5px; color: #000; font-weight: bold; cursor: pointer;">🎤 Start Talking</button>
    </div>

    <div id="chatBox">
        <div id="chatMessages"></div>
        <div id="chatInput">
            <input type="text" id="chatText" placeholder="Type message..." maxlength="100">
            <button onclick="sendChat()">SEND</button>
        </div>
    </div>

    <div id="mobileControls">
        <div id="leftControls">
            <div class="controlBtn" id="leftBtn">⬅️</div>
            <div class="controlBtn" id="rightBtn">➡️</div>
            <div class="controlBtn" id="hornBtn" onclick="honkHorn()">📢</div>
            <div class="controlBtn" id="micBtn" onclick="toggleMic()">🎤</div>
        </div>
        <div id="rightControls">
            <div class="controlBtn" id="nitroBtn">🚀<br>NITRO</div>
            <div class="controlBtn" id="gasBtn">⬆️<br>GO</div>
            <div class="controlBtn" id="brakeBtn">⬇️<br>STOP</div>
        </div>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let player = {
            worldX: 0, worldY: 0, angle: 0, speed: 0, name: 'Player',
            nitro: 100, color: '#00d4ff', carType: 'f1', lap: 0, checkpoint: 0
        };

        let players = {};
        let keys = { w: false, a: false, d: false, s: false, space: false };
        let soundOn = true;
        let audioContext, engineGain, engineSound;
        let gameStarted = false;
        let skidMarks = [];
        let trafficCars = [];

        let localStream = null;
        let peerConnections = {};
        let micOn = false;
        let isSpeaking = false;

        const checkpoints = [
            { x: 0, y: -1500, radius: 150 },
            { x: 2000, y: 0, radius: 150 },
            { x: 0, y: 1500, radius: 150 },
            { x: -2000, y: 0, radius: 150 }
        ];

        for(let i = 0; i < 8; i++) {
            trafficCars.push({
                x: (Math.random() - 0.5) * 3000,
                y: (Math.random() - 0.5) * 3000,
                speed: 5 + Math.random() * 5,
                angle: Math.random() * Math.PI * 2,
                color: `hsl(${Math.random()*360}, 70%, 50%)`
            });
        }

        document.querySelectorAll('.carOption').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.carOption').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                player.carType = opt.dataset.car;
            });
        });

        function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                engineSound = audioContext.createOscillator();
                engineGain = audioContext.createGain();
                engineSound.type = 'sawtooth';
                engineSound.frequency.value = 50;
                engineGain.gain.value = 0;
                engineSound.connect(engineGain);
                engineGain.connect(audioContext.destination);
                engineSound.start();
            } catch(e) {}
        }

        function playNitroSound() {
            if (!soundOn ||!audioContext) return;
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, audioContext.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, audioContext.currentTime + 0.4);
                gain.gain.setValueAtTime(0.4, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + 0.4);
            } catch(e) {}
        }

        function honkHorn() {
            if (!soundOn ||!audioContext) return;
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'square';
                osc.frequency.value = 440;
                gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + 0.3);
                socket.emit('honk', player.name);
            } catch(e) {}
        }

        function updateEngineSound() {
            if (!soundOn ||!engineGain) return;
            const speedRatio = Math.abs(player.speed) / 20;
            engineSound.frequency.value = 60 + speedRatio * 300;
            engineGain.gain.value = 0.05 + speedRatio * 0.25;
        }

        function toggleSound() {
            soundOn =!soundOn;
            document.getElementById('soundBtn').textContent = soundOn? '🔊 Sound: ON' : '🔇 Sound: OFF';
            if (engineGain) engineGain.gain.value = soundOn? 0.05 : 0;
        }

        async function toggleMic() {
            if (!micOn) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    micOn = true;
                    document.getElementById('micBtn').classList.add('active');
                    document.getElementById('micToggle').textContent = '🔴 Stop Talking';
                    document.getElementById('micToggle').style.background = '#ff0000';
                    socket.emit('startVoice', player.name);
                    setupVoiceDetection();
                    Object.keys(players).forEach(id => {
                        if (id!== socket.id) createPeerConnection(id, true);
                    });
                } catch(err) {
                    alert('Microphone permission chahiye! Browser settings me Allow karo.');
                }
            } else {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                    localStream = null;
                }
                micOn = false;
                document.getElementById('micBtn').classList.remove('active');
                document.getElementById('micToggle').textContent = '🎤 Start Talking';
                document.getElementById('micToggle').style.background = '#00ff00';
                socket.emit('stopVoice', player.name);
                Object.values(peerConnections).forEach(pc => pc.close());
                peerConnections = {};
            }
        }

        function setupVoiceDetection() {
            if (!localStream ||!audioContext) return;
            const analyser = audioContext.createAnalyser();
            const source = audioContext.createMediaStreamSource(localStream);
            source.connect(analyser);
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            function checkSpeaking() {
                if (!micOn) return;
                analyser.getByteFrequencyData(dataArray);
                const volume = dataArray.reduce((a, b) => a + b) / dataArray.length;
                if (volume > 20 &&!isSpeaking) {
                    isSpeaking = true;
                    socket.emit('speaking', { name: player.name, speaking: true });
                } else if (volume <= 20 && isSpeaking) {
                    isSpeaking = false;
                    socket.emit('speaking', { name: player.name, speaking: false });
                }
                requestAnimationFrame(checkSpeaking);
            }
            checkSpeaking();
        }

        function createPeerConnection(peerId, initiator) {
            if (peerConnections[peerId]) return;
            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            peerConnections[peerId] = pc;
            if (localStream) localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            pc.ontrack = (event) => {
                const audio = document.createElement('audio');
                audio.srcObject = event.streams[0];
                audio.autoplay = true;
                audio.id = `audio-${peerId}`;
                document.body.appendChild(audio);
            };
            pc.onicecandidate = (event) => {
                if (event.candidate) socket.emit('ice-candidate', { to: peerId, candidate: event.candidate });
            };
            if (initiator) {
                pc.createOffer().then(offer => {
                    pc.setLocalDescription(offer);
                    socket.emit('offer', { to: peerId, offer: offer });
                });
            }
        }

        socket.on('offer', async (data) => {
            createPeerConnection(data.from, false);
            const pc = peerConnections[data.from];
            await pc.setRemoteDescription(data.offer);
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('answer', { to: data.from, answer: answer });
        });

        socket.on('answer', async (data) => {
            const pc = peerConnections[data.from];
            if (pc) await pc.setRemoteDescription(data.answer);
        });

        socket.on('ice-candidate', async (data) => {
            const pc = peerConnections[data.from];
            if (pc) await pc.addIceCandidate(data.candidate);
        });

        function setupButton(btn, key) {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            btn.addEventListener('mousedown', () => keys[key] = true);
            btn.addEventListener('mouseup', () => keys[key] = false);
            btn.addEventListener('mouseleave', () => keys[key] = false);
        }

        setupButton(document.getElementById('gasBtn'), 'w');
        setupButton(document.getElementById('brakeBtn'), 's');
        setupButton(document.getElementById('leftBtn'), 'a');
        setupButton(document.getElementById('rightBtn'), 'd');

        const nitroBtn = document.getElementById('nitroBtn');
        nitroBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.space = true; playNitroSound(); });
        nitroBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.space = false; });
        nitroBtn.addEventListener('mousedown', () => { keys.space = true; playNitroSound(); });
        nitroBtn.addEventListener('mouseup', () => keys.space = false);

        window.addEventListener('keydown', (e) => {
            if(e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
            if(e.key === 's' || e.key === 'ArrowDown') keys.s = true;
            if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if(e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
            if(e.key === ' ') { keys.space = true; playNitroSound(); }
            if(e.key === 'h' || e.key === 'H') honkHorn();
            if(e.key === 'm' || e.key === 'M') toggleMic();
            if(e.key === 'Enter') document.getElementById('chatText').focus();
        });
        window.addEventListener('keyup', (e) => {
            if(e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
            if(e.key === 's' || e.key === 'ArrowDown') keys.s = false;
            if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if(e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
            if(e.key === ' ') keys.space = false;
        });

        function startGame() {
            const name = document.getElementById('playerName').value.trim() || 'Sneh';
            if (!audioContext) initAudio();
            player.name = name;
            gameStarted = true;
            document.getElementById('joinScreen').style.display = 'none';
            socket.emit('joinGame', { name: name, carType: player.carType });
        }

        function sendChat() {
            const input = document.getElementById('chatText');
            const msg = input.value.trim();
            if (msg) {
                socket.emit('chatMessage', { name: player.name, message: msg });
                input.value = '';
            }
        }

        document.getElementById('chatText').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChat();
        });

        socket.on('chatMessage', (data) => {
            const chatDiv = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.innerHTML = `<b style="color: #00d4ff">${data.name}:</b> ${data.message}`;
            chatDiv.appendChild(msgDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        });

        socket.on('honk', (name) => {
            const chatDiv = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.innerHTML = `<i style="color: #ffff00">📢 ${name} honked!</i>`;
            chatDiv.appendChild(msgDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        });

        socket.on('speaking', (data) => {
            const voiceDiv = document.getElementById(`voice-${data.name}`);
            if (voiceDiv) {
                if (data.speaking) voiceDiv.classList.add('speaking');
                else voiceDiv.classList.remove('speaking');
            }
        });

        socket.on('startVoice', (name) => {
            const chatDiv = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.innerHTML = `<i style="color: #00ff00">🎤 ${name} joined voice chat</i>`;
            chatDiv.appendChild(msgDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        });

        socket.on('stopVoice', (name) => {
            const audio = document.getElementById(`audio-${name}`);
            if (audio) audio.remove();
        });

        socket.on('updatePlayers', (serverPlayers) => {
            players = serverPlayers;
            const list = document.getElementById('players');
            const voiceList = document.getElementById('voicePlayers');
            list.innerHTML = '';
            voiceList.innerHTML = '';
            const sorted = Object.values(players).sort((a, b) => (b.lap || 0) - (a.lap || 0));
            const lbList = document.getElementById('leaderboardList');
            lbList.innerHTML = '';

            sorted.forEach((p, index) => {
                list.innerHTML += `<div>🏎️ ${p.name}</div>`;
                voiceList.innerHTML += `<div class="voicePlayer" id="voice-${p.name}">🎤 ${p.name}</div>`;
                const medal = index === 0? '🥇' : index === 1? '🥈' : index === 2? '🥉' : `${index + 1}.`;
                lbList.innerHTML += `<div class="leaderboard-item"><span>${medal} ${p.name}</span><span>Lap ${p.lap || 0}</span></div>`;
            });
        });

        function checkCheckpoint() {
            const cp = checkpoints[player.checkpoint];
            const dist = Math.hypot(player.worldX - cp.x, player.worldY - cp.y);
            if (dist < cp.radius) {
                player.checkpoint = (player.checkpoint + 1) % checkpoints.length;
                if (player.checkpoint === 0) {
                    player.lap++;
                    document.getElementById('lap').textContent = player.lap;
                    if (player.lap >= 3) {
                        alert(`🏆 ${player.name} WON THE RACE! 🏆`);
                        socket.emit('raceWon', player.name);
                    }
                }
            }
        }

        function update() {
            if (!gameStarted) return;

            if (keys.w) player.speed += 1.0;
            if (keys.s) player.speed -= 1.0;
            if (keys.a) player.angle -= 0.05;  // Left
            if (keys.d) player.angle += 0.05;  // Right
            if (keys.space && player.nitro > 0) {
                player.speed += 2.0;
                player.nitro -= 3;
                document.getElementById('nitroFill').style.width = player.nitro + '%';
            }

            if (player.nitro < 100 &&!keys.space) {
                player.nitro += 0.8;
                document.getElementById('nitroFill').style.width = player.nitro + '%';
            }

            player.speed *= 0.96;
            if (player.speed > 22) player.speed = 22;
            if (player.speed < -8) player.speed = -8;

            player.worldX += Math.cos(player.angle) * player.speed;
            player.worldY += Math.sin(player.angle) * player.speed;

            if (Math.abs(player.speed) > 10 && (keys.a || keys.d)) {
                skidMarks.push({
                    x: player.worldX - Math.cos(player.angle) * 30,
                    y: player.worldY - Math.sin(player.angle) * 30,
                    life: 100
                });
            }

            trafficCars.forEach(car => {
                car.x += Math.cos(car.angle) * car.speed;
                car.y += Math.sin(car.angle) * car.speed;
                if (Math.abs(car.x) > 3000 || Math.abs(car.y) > 3000) {
                    car.x = (Math.random() - 0.5) * 1000;
                    car.y = (Math.random() - 0.5) * 1000;
                }
            });

            checkCheckpoint();
            updateEngineSound();
            document.getElementById('speed').textContent = Math.abs(Math.floor(player.speed * 10));
            socket.emit('playerMove', {
                x: player.worldX, y: player.worldY,
                rotation: player.angle, carType: player.carType, lap: player.lap
            });
        }

        function drawHighway() {
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#001a33');
            skyGradient.addColorStop(1, '#003366');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width/2 - player.worldX, canvas.height/2 - player.worldY);

            ctx.fillStyle = '#1a4d1a';
            ctx.fillRect(-5000, -5000, 10000, 10000);

            skidMarks = skidMarks.filter(mark => {
                mark.life -= 1;
                if (mark.life > 0) {
                    ctx.fillStyle = `rgba(20,20,${mark.life/200})`;
                    ctx.fillRect(mark.x - 3, mark.y - 3, 6);
                    return true;
                }
                return false;
            });

            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(-5000, -200, 10000, 400);

            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 5;
            ctx.setLineDash([40, 40]);
            for(let i = -100; i <= 100; i += 100) {
                ctx.beginPath();
                ctx.moveTo(-5000, i);
                ctx.lineTo(5000, i);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(-5000, -3);
            ctx.lineTo(5000, -3);
            ctx.moveTo(-5000, 3);
            ctx.lineTo(5000, 3);
            ctx.stroke();

            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 8;
            ctx.setLineDash([20, 20]);
            ctx.beginPath();
            ctx.moveTo(-5000, -200);
            ctx.lineTo(5000, -200);
            ctx.moveTo(-5000, 200);
            ctx.lineTo(5000, 200);
            ctx.stroke();
            ctx.setLineDash([]);

            for(let x = -4000; x < 4000; x += 300) {
                ctx.fillStyle = '#444';
                ctx.fillRect(x, -250, 10, 50);
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(x + 5, -200, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#444';
                ctx.fillRect(x, 200, 10, 50);
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(x + 5, 250, 8, 0, Math.PI * 2);
                ctx.fill();
            }

            trafficCars.forEach(car => {
                ctx.save();
                ctx.translate(car.x, car.y);
                ctx.rotate(car.angle);
                ctx.fillStyle = car.color;
                ctx.fillRect(-25, -12, 50, 24);
                ctx.fillStyle = '#87ceeb';
                ctx.fillRect(-15, -10, 30, 20);
                ctx.fillStyle = '#000';
                ctx.fillRect(-22, -16, 12, 6);
                ctx.fillRect(-22, 10, 12, 6);
                ctx.fillRect(13, -16, 12, 6);
                ctx.fillRect(13, 10, 12, 6);
                ctx.restore();
            });

            checkpoints.forEach((cp, i) => {
                ctx.strokeStyle = player.checkpoint === i? '#00ff00' : '#333';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(cp.x, cp.y, cp.radius, 0, Math.PI * 2);
                ctx.stroke();
            });

            ctx.restore();

            ctx.fillStyle = 'rgba(0, 20, 40, 0.8)';
            for(let i = 0; i < 20; i++) {
                const x = (i * 200 - player.worldX * 0.1) % (canvas.width + 200);
                const h = 100 + Math.sin(i) * 50;
                ctx.fillRect(x, 0, 150, h);
            }
        }

        function drawCar(worldX, worldY, angle, color, name, isMe, carType) {
            const screenX = canvas.width/2 + (worldX - player.worldX);
            const screenY = canvas.height/2 + (worldY - player.worldY);

            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(angle);

            if (carType === 'f1') {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(-50, -15, 100, 30);
                ctx.fillStyle = color;
                ctx.fillRect(-48, -13, 96, 26);
                ctx.beginPath();
                ctx.moveTo(48, 0);
                ctx.lineTo(60, -8);
                ctx.lineTo(60, 8);
                ctx.fill();
                ctx.fillStyle = '#333';
                ctx.fillRect(-48, -20, 15, 40);
                ctx.fillRect(35, -15, 10, 30);
            } else if (carType === 'truck') {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(-40, -25, 80, 50);
                ctx.fillStyle = color;
                               ctx.fillRect(-38, -23, 76, 46);
                ctx.fillStyle = '#87ceeb';
                ctx.fillRect(-15, -20, 30, 25);
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-25, -28, 15, 0, Math.PI * 2);
                ctx.arc(-25, 28, 15, 0, Math.PI * 2);
                ctx.arc(25, -28, 15, 0, Math.PI * 2);
                ctx.arc(25, 28, 15, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(-45, -18, 90, 36);
                ctx.fillStyle = color;
                ctx.fillRect(-43, -16, 86, 32);
                const gradient = ctx.createLinearGradient(0, -14, 0, 14);
                gradient.addColorStop(0, isMe? '#00ffff' : '#ff0088');
                gradient.addColorStop(1, isMe? '#0088ff' : '#ff0044');
                ctx.fillStyle = gradient;
                ctx.fillRect(-20, -14, 40, 28);
                ctx.fillStyle = '#87ceeb';
                ctx.fillRect(-18, -12, 36, 10);
                ctx.fillRect(-18, 2, 36, 10);
            }

            ctx.fillStyle = '#000';
            ctx.fillRect(-35, -22, 18, 10);
            ctx.fillRect(-35, 12, 18, 10);
            ctx.fillRect(20, -22, 18, 10);
            ctx.fillRect(20, 12, 18, 10);

            ctx.fillStyle = '#ffff00';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ffff00';
            ctx.fillRect(43, -12, 10, 10);
            ctx.fillRect(43, 2, 10, 10);
            ctx.shadowBlur = 0;

            if (isMe && keys.space && player.nitro > 0) {
                ctx.fillStyle = '#ff4400';
                ctx.beginPath();
                ctx.moveTo(-43, -10);
                ctx.lineTo(-65, 0);
                ctx.lineTo(-43, 10);
                ctx.fill();
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.moveTo(-43, -6);
                ctx.lineTo(-55, 0);
                ctx.lineTo(-43, 6);
                ctx.fill();
            }

            ctx.restore();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 7;
            ctx.strokeText(name, screenX, screenY - 60);
            ctx.fillText(name, screenX, screenY - 60);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawHighway();

            Object.values(players).forEach(p => {
                if (p.id!== socket.id) {
                    drawCar(p.x, p.y, p.rotation, '#ff3366', p.name, false, p.carType || 'f1');
                }
            });

            if (gameStarted) {
                drawCar(player.worldX, player.worldY, player.angle, '#00d4ff', player.name, true, player.carType);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        gameLoop();
    </script>
</body>
</html>
