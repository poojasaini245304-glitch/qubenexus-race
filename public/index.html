<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qubenexus Racing - FIXED</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #0a0a0a; color: #00d4ff; font-family: 'Arial', sans-serif; overflow: hidden; }
        #gameCanvas { display: block; background: #1a5c1a; }
        #joinScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 200; }
       .joinBox { background: linear-gradient(135deg, #1a1a1a, #0a0a0a); padding: 40px; border-radius: 20px; border: 3px solid #00d4ff; text-align: center; }
       .joinBox h1 { margin-bottom: 20px; font-size: 2.5em; }
       .joinBox input { padding: 15px; font-size: 18px; background: #0a0a0a; border: 2px solid #00d4ff; color: #00d4ff; border-radius: 10px; margin: 10px; width: 280px; }
       .joinBox button { padding: 15px 50px; font-size: 22px; background: linear-gradient(45deg, #00d4ff, #00ffff); color: #000; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 15px; border: 2px solid #00d4ff; }
        #playerList { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 15px; border: 2px solid #00d4ff; }
        #mobileControls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; z-index: 100; }
       .controlBtn { width: 90px; height: 90px; background: rgba(0,212,255,0.4); border: 4px solid #00d4ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; color: #00d4ff; cursor: pointer; box-shadow: 0 0 20px #00d4ff50; }
       .controlBtn:active { background: rgba(0,212,255,0.9); transform: scale(0.9); }
        #leftControls { display: flex; gap: 20px; }
        #rightControls { display: flex; gap: 15px; flex-direction: column; align-items: center; }
        #nitroBtn { background: rgba(255,0,102,0.4); border-color: #ff0066; color: #ff0066; width: 110px; height: 110px; box-shadow: 0 0 20px #ff006650; }
       .nitro-bar { width: 150px; height: 15px; background: #333; border-radius: 10px; overflow: hidden; margin-top: 5px; }
       .nitro-fill { height: 100%; background: linear-gradient(90deg, #ff0066, #ff6600); }
        #soundBtn { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 2px solid #00d4ff; color: #00d4ff; padding: 10px 20px; border-radius: 10px; cursor: pointer; z-index: 100; }
    </style>
</head>
<body>
    <div id="joinScreen">
        <div class="joinBox">
            <h1>🏎️ QUBENEXUS RACING 🏎️</h1>
            <p style="font-size: 1.1em; margin-bottom: 20px;">🔊 Car Fixed - Ab Dikhegi!</p>
            <input type="text" id="playerName" placeholder="Enter Your Name" maxlength="15">
            <br>
            <button onclick="joinGame()">🏁 START RACE</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <button id="soundBtn" onclick="toggleSound()">🔊 Sound: ON</button>

    <div id="ui">
        <h3>🏁 QUBENEXUS</h3>
        <p>Speed: <span id="speed">0</span> km/h</p>
        <p>Nitro:</p>
        <div class="nitro-bar"><div class="nitro-fill" id="nitroFill" style="width: 100%"></div></div>
    </div>

    <div id="playerList">
        <h3>🏆 Racers:</h3>
        <div id="players"></div>
    </div>

    <div id="mobileControls">
        <div id="leftControls">
            <div class="controlBtn" id="leftBtn">⬅️</div>
            <div class="controlBtn" id="rightBtn">➡️</div>
        </div>
        <div id="rightControls">
            <div class="controlBtn" id="nitroBtn">🚀<br>NITRO</div>
            <div class="controlBtn" id="gasBtn">⬆️<br>GO</div>
            <div class="controlBtn" id="brakeBtn">⬇️<br>STOP</div>
        </div>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // FIXED: Gaadi hamesha dikhegi
        let player = {
            x: 0, y: 0,
            angle: -Math.PI/2,
            speed: 0,
            name: '',
            nitro: 100,
            color: '#00d4ff'
        };
        let players = {};
        let keys = { w: false, a: false, d: false, s: false, space: false };
        let soundOn = true;
        let audioContext, engineGain, engineSound;
        let gameStarted = false;

        function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                engineSound = audioContext.createOscillator();
                engineGain = audioContext.createGain();
                engineSound.type = 'sawtooth';
                engineSound.frequency.value = 50;
                engineGain.gain.value = 0;
                engineSound.connect(engineGain);
                engineGain.connect(audioContext.destination);
                engineSound.start();
            } catch(e) { console.log('Audio not supported'); }
        }

        function playNitroSound() {
            if (!soundOn ||!audioContext) return;
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, audioContext.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + 0.3);
            } catch(e) {}
        }

        function updateEngineSound() {
            if (!soundOn ||!engineGain) return;
            const speedRatio = Math.abs(player.speed) / 15;
            engineSound.frequency.value = 50 + speedRatio * 250;
            engineGain.gain.value = speedRatio * 0.2;
        }

        function toggleSound() {
            soundOn =!soundOn;
            document.getElementById('soundBtn').textContent = soundOn? '🔊 Sound: ON' : '🔇 Sound: OFF';
            if (engineGain) engineGain.gain.value = soundOn? 0.05 : 0;
        }

        // Controls
        function addBtnListeners(btn, key) {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            btn.addEventListener('mousedown', () => keys[key] = true);
            btn.addEventListener('mouseup', () => keys[key] = false);
            btn.addEventListener('mouseleave', () => keys[key] = false);
        }

        addBtnListeners(document.getElementById('gasBtn'), 'w');
        addBtnListeners(document.getElementById('brakeBtn'), 's');
        addBtnListeners(document.getElementById('leftBtn'), 'a');
        addBtnListeners(document.getElementById('rightBtn'), 'd');

        const nitroBtn = document.getElementById('nitroBtn');
        nitroBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.space = true; playNitroSound(); });
        nitroBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.space = false; });
        nitroBtn.addEventListener('mousedown', () => { keys.space = true; playNitroSound(); });
        nitroBtn.addEventListener('mouseup', () => keys.space = false);

        window.addEventListener('keydown', (e) => {
            if(e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
            if(e.key === 's' || e.key === 'ArrowDown') keys.s = true;
            if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if(e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
            if(e.key === ' ') { keys.space = true; playNitroSound(); }
        });
        window.addEventListener('keyup', (e) => {
            if(e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
            if(e.key === 's' || e.key === 'ArrowDown') keys.s = false;
            if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if(e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
            if(e.key === ' ') keys.space = false;
        });

        function joinGame() {
            const name = document.getElementById('playerName').value.trim() || 'Player';
            if (!audioContext) initAudio();
            player.name = name;
            gameStarted = true;
            document.getElementById('joinScreen').style.display = 'none';
            socket.emit('joinGame', name);
        }

        socket.on('updatePlayers', (serverPlayers) => {
            players = serverPlayers;
            const list = document.getElementById('players');
            list.innerHTML = '';
            Object.values(players).forEach(p => {
                list.innerHTML += `<div>🏎️ ${p.name}</div>`;
            });
        });

        function update() {
            if (!gameStarted) return;

            if (keys.w) player.speed += 0.8;
            if (keys.s) player.speed -= 0.8;
            if (keys.a) player.angle -= 0.07;
            if (keys.d) player.angle += 0.07;
            if (keys.space && player.nitro > 0) {
                player.speed += 1.8;
                player.nitro -= 2.5;
                document.getElementById('nitroFill').style.width = player.nitro + '%';
            }

            if (player.nitro < 100 &&!keys.space) {
                player.nitro += 0.6;
                document.getElementById('nitroFill').style.width = player.nitro + '%';
            }

            player.speed *= 0.97;
            if (player.speed > 20) player.speed = 20;
            if (player.speed < -7) player.speed = -7;

            player.x += Math.cos(player.angle) * player.speed;
            player.y += Math.sin(player.angle) * player.speed;

            updateEngineSound();
            document.getElementById('speed').textContent = Math.abs(Math.floor(player.speed * 10));
            socket.emit('playerMove', { x: player.x, y: player.y, rotation: player.angle });
        }

        function drawTrack() {
            // Grass
            ctx.fillStyle = '#0d4d0d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Camera centered on player
            ctx.save();
            ctx.translate(canvas.width/2 - player.x, canvas.height/2 - player.y);

            // Big oval track
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 250;
            ctx.beginPath();
            ctx.ellipse(0, 0, 1000, 700, 0, 0, Math.PI * 2);
            ctx.stroke();

            // Track markings
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 8;
            ctx.setLineDash([50, 50]);
            ctx.beginPath();
            ctx.ellipse(0, 0, 1000, 700, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // Start line
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 20;
            ctx.beginPath();
            ctx.moveTo(0, -700);
            ctx.lineTo(0, -500);
            ctx.stroke();

            ctx.restore();
        }

        function drawCar(x, y, angle, color, name, isMe) {
            // Convert to screen coordinates
            const screenX = canvas.width/2 + (x - player.x);
            const screenY = canvas.height/2 + (y - player.y);

            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(angle);

            // HUGE CAR - 4x size
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(-40, -20, 80, 40);

            // Main body
            ctx.fillStyle = color;
            ctx.fillRect(-38, -18, 76, 36);

            // Roof with gradient
            const gradient = ctx.createLinearGradient(0, -16, 0, 16);
            gradient.addColorStop(0, isMe? '#00ffff' : '#ff0088');
            gradient.addColorStop(1, isMe? '#0088ff' : '#ff0044');
            ctx.fillStyle = gradient;
            ctx.fillRect(-20, -16, 40, 32);

            // Windows
            ctx.fillStyle = '#87ceeb';
            ctx.fillRect(-18, -14, 36, 12);
            ctx.fillRect(-18, 2, 36, 12);

            // Wheels - Bigger
            ctx.fillStyle = '#000';
            ctx.fillRect(-35, -24, 18, 10);
            ctx.fillRect(-35, 14, 18, 10);
            ctx.fillRect(20, -24, 18, 10);
            ctx.fillRect(20, 14, 18, 10);

            // Wheel rims
            ctx.fillStyle = '#ccc';
            ctx.fillRect(-32, -22, 12, 6);
            ctx.fillRect(-32, 16, 12, 6);
            ctx.fillRect(23, -22, 12, 6);
            ctx.fillRect(23, 16, 12, 6);

            // Headlights - glowing
            ctx.fillStyle = '#ffff00';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ffff00';
            ctx.fillRect(36, -12, 8, 8);
            ctx.fillRect(36, 4, 8, 8);
            ctx.shadowBlur = 0;

            // Spoiler
            ctx.fillStyle = '#222';
            ctx.fillRect(-38, -18, 8, 36);

            // Exhaust flames when nitro
            if (isMe && keys.space && player.nitro > 0) {
                ctx.fillStyle = '#ff6600';
                ctx.beginPath();
                ctx.moveTo(-38, -8);
                ctx.lineTo(-50, 0);
                ctx.lineTo(-38, 8);
                ctx.fill();
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.moveTo(-38, -5);
                ctx.lineTo(-45, 0);
                ctx.lineTo(-38, 5);
                ctx.fill();
            }

            ctx.restore();

            // Name tag - Bigger
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 22px Arial';
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 6;
            ctx.strokeText(name, screenX, screenY - 55);
            ctx.fillText(name, screenX, screenY - 55);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTrack();

            // Draw all players from server
            Object.values(players).forEach(p => {
                const color = p.id === socket.id? '#00d4ff' : '#ff3366';
                drawCar(p.x, p.y, p.rotation, color, p.name, p.id === socket.id);
            });

            // FIXED: Always draw local player even if server hasn't sent it yet
            if (gameStarted &&!players[socket.id]) {
                drawCar(player.x, player.y, player.angle, '#00d4ff', player.name, true);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
