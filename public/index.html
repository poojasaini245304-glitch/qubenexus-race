<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qubenexus Racing - With Sound</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #0a0a0a; color: #00d4ff; font-family: 'Arial', sans-serif; overflow: hidden; }
        #gameCanvas { display: block; background: #2a6f2a; }
        #joinScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 200; }
        .joinBox { background: linear-gradient(135deg, #1a1a1a, #0a0a0a); padding: 40px; border-radius: 20px; border: 3px solid #00d4ff; text-align: center; }
        .joinBox h1 { margin-bottom: 20px; font-size: 2.5em; }
        .joinBox input { padding: 15px; font-size: 18px; background: #0a0a0a; border: 2px solid #00d4ff; color: #00d4ff; border-radius: 10px; margin: 10px; width: 280px; }
        .joinBox button { padding: 15px 50px; font-size: 22px; background: linear-gradient(45deg, #00d4ff, #00ffff); color: #000; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 15px; border: 2px solid #00d4ff; }
        #playerList { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 15px; border: 2px solid #00d4ff; }
        #mobileControls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; z-index: 100; }
        .controlBtn { width: 80px; height: 80px; background: rgba(0,212,255,0.3); border: 3px solid #00d4ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #00d4ff; cursor: pointer; }
        .controlBtn:active { background: rgba(0,212,255,0.8); transform: scale(0.95); }
        #leftControls { display: flex; gap: 15px; }
        #rightControls { display: flex; gap: 15px; flex-direction: column; align-items: center; }
        #nitroBtn { background: rgba(255,0,102,0.3); border-color: #ff0066; color: #ff0066; width: 100px; height: 100px; }
        #nitroBtn:active { background: rgba(255,0,102,0.8); }
        .nitro-bar { width: 150px; height: 15px; background: #333; border-radius: 10px; overflow: hidden; margin-top: 5px; }
        .nitro-fill { height: 100%; background: linear-gradient(90deg, #ff0066, #ff6600); transition: 0.3s; }
        #soundBtn { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 2px solid #00d4ff; color: #00d4ff; padding: 10px 20px; border-radius: 10px; cursor: pointer; z-index: 100; }
    </style>
</head>
<body>
    <div id="joinScreen">
        <div class="joinBox">
            <h1>🏎️ QUBENEXUS RACING 🏎️</h1>
            <p style="font-size: 1.1em; margin-bottom: 20px;">🔊 With Engine Sounds!</p>
            <input type="text" id="playerName" placeholder="Enter Your Name" maxlength="15">
            <br>
            <button onclick="joinGame()">🏁 START RACE</button>
        </div>
    </div>
   
    <canvas id="gameCanvas"></canvas>
    <button id="soundBtn" onclick="toggleSound()">🔊 Sound: ON</button>
   
    <div id="ui">
        <h3>🏁 QUBENEXUS</h3>
        <p>Speed: <span id="speed">0</span> km/h</p>
        <p>Lap: <span id="lap">0</span>/3</p>
        <p>Nitro:</p>
        <div class="nitro-bar"><div class="nitro-fill" id="nitroFill" style="width: 100%"></div></div>
    </div>
   
    <div id="playerList">
        <h3>🏆 Racers:</h3>
        <div id="players"></div>
    </div>

    <div id="mobileControls">
        <div id="leftControls">
            <div class="controlBtn" id="leftBtn">⬅️</div>
            <div class="controlBtn" id="rightBtn">➡️</div>
        </div>
        <div id="rightControls">
            <div class="controlBtn" id="nitroBtn">🚀<br>NITRO</div>
            <div class="controlBtn" id="gasBtn">⬆️<br>GO</div>
            <div class="controlBtn" id="brakeBtn">⬇️<br>STOP</div>
        </div>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let player = { x: 600, y: 350, angle: -1.57, speed: 0, name: '', nitro: 100, lap: 0 };
        let players = {};
        let keys = { w: false, a: false, d: false, s: false, space: false };
        let soundOn = true;
        let engineSound, nitroSound, brakeSound;
        let audioContext;

        // SOUND SETUP
        function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
           
            // Engine sound using oscillator
            engineSound = audioContext.createOscillator();
            const engineGain = audioContext.createGain();
            engineSound.type = 'sawtooth';
            engineSound.frequency.value = 50;
            engineGain.gain.value = 0;
            engineSound.connect(engineGain);
            engineGain.connect(audioContext.destination);
            engineSound.start();
           
            window.engineGain = engineGain;
        }

        function playNitroSound() {
            if (!soundOn || !audioContext) return;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.3);
        }

        function playBrakeSound() {
            if (!soundOn || !audioContext) return;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'square';
            osc.frequency.value = 150;
            gain.gain.setValueAtTime(0.2, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.2);
        }

        function updateEngineSound() {
            if (!soundOn || !window.engineGain) return;
            const speedRatio = Math.abs(player.speed) / 12;
            engineSound.frequency.value = 50 + speedRatio * 200;
            window.engineGain.gain.value = speedRatio * 0.15;
        }

        function toggleSound() {
            soundOn = !soundOn;
            document.getElementById('soundBtn').textContent = soundOn ? '🔊 Sound: ON' : '🔇 Sound: OFF';
            if (window.engineGain) window.engineGain.gain.value = soundOn ? 0.05 : 0;
        }

        // Button Controls
        document.getElementById('gasBtn').addEventListener('touchstart', (e) => { e.preventDefault(); keys.w = true; });
        document.getElementById('gasBtn').addEventListener('touchend', (e) => { e.preventDefault(); keys.w = false; });
        document.getElementById('gasBtn').addEventListener('mousedown', () => keys.w = true);
        document.getElementById('gasBtn').addEventListener('mouseup', () => keys.w = false);
       
        document.getElementById('brakeBtn').addEventListener('touchstart', (e) => { e.preventDefault(); keys.s = true; playBrakeSound(); });
        document.getElementById('brakeBtn').addEventListener('touchend', (e) => { e.preventDefault(); keys.s = false; });
        document.getElementById('brakeBtn').addEventListener('mousedown', () => { keys.s = true; playBrakeSound(); });
        document.getElementById('brakeBtn').addEventListener('mouseup', () => keys.s = false);
       
        document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); keys.a = true; });
        document.getElementById('leftBtn').addEventListener('touchend', (e) => { e.preventDefault(); keys.a = false; });
        document.getElementById('leftBtn').addEventListener('mousedown', () => keys.a = true);
        document.getElementById('leftBtn').addEventListener('mouseup', () => keys.a = false);
       
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); keys.d = true; });
        document.getElementById('rightBtn').addEventListener('touchend', (e) => { e.preventDefault(); keys.d = false; });
        document.getElementById('rightBtn').addEventListener('mousedown', () => keys.d = true);
        document.getElementById('rightBtn').addEventListener('mouseup', () => keys.d = false);
       
        document.getElementById('nitroBtn').addEventListener('touchstart', (e) => { e.preventDefault(); keys.space = true; playNitroSound(); });
        document.getElementById('nitroBtn').addEventListener('touchend', (e) => { e.preventDefault(); keys.space = false; });
        document.getElementById('nitroBtn').addEventListener('mousedown', () => { keys.space = true; playNitroSound(); });
        document.getElementById('nitroBtn').addEventListener('mouseup', () => keys.space = false);

        // Keyboard
        window.addEventListener('keydown', (e) => {
            if(e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
            if(e.key === 's' || e.key === 'ArrowDown') { keys.s = true; playBrakeSound(); }
            if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if(e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
            if(e.key === ' ') { keys.space = true; playNitroSound(); }
        });
        window.addEventListener('keyup', (e) => {
            if(e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
            if(e.key === 's' || e.key === 'ArrowDown') keys.s = false;
            if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if(e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
            if(e.key === ' ') keys.space = false;
        });

        function joinGame() {
            const name = document.getElementById('playerName').value.trim();
            if (!name) { alert('Please enter your name!'); return; }
            if (!audioContext) initAudio();
            player.name = name;
            document.getElementById('joinScreen').style.display = 'none';
            socket.emit('joinGame', name);
        }

        socket.on('updatePlayers', (serverPlayers) => {
            players = serverPlayers;
            const list = document.getElementById('players');
            list.innerHTML = '';
            Object.values(players).forEach(p => {
                list.innerHTML += `<div>🏎️ ${p.name}</div>`;
            });
        });

        function update() {
            if (keys.w) player.speed += 0.5;
            if (keys.s) player.speed -= 0.5;
            if (keys.a) player.angle -= 0.05;
            if (keys.d) player.angle += 0.05;
            if (keys.space && player.nitro > 0) {
                player.speed += 1;
                player.nitro -= 1.5;
                document.getElementById('nitroFill').style.width = player.nitro + '%';
            }
           
            if (player.nitro < 100 && !keys.space) {
                player.nitro += 0.3;
                document.getElementById('nitroFill').style.width = player.nitro + '%';
            }

            player.speed *= 0.97;
            if (player.speed > 12) player.speed = 12;
            if (player.speed < -4) player.speed = -4;
           
            player.x += Math.cos(player.angle) * player.speed;
            player.y += Math.sin(player.angle) * player.speed;

            updateEngineSound();
            document.getElementById('speed').textContent = Math.abs(Math.floor(player.speed * 10));
            socket.emit('playerMove', { x: player.x, y: player.y, rotation: player.angle });
        }

        function drawTrack() {
            ctx.fillStyle = '#2a6f2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
           
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 120;
            ctx.beginPath();
            ctx.ellipse(canvas.width/2, canvas.height/2, canvas.width*0.35, canvas.height*0.35, 0, 0, Math.PI * 2);
            ctx.stroke();
           
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 20]);
            ctx.beginPath();
            ctx.ellipse(canvas.width/2, canvas.height/2, canvas.width*0.35, canvas.height*0.35, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawCar(x, y, angle, color, name) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
           
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(-25, -13, 50, 26);
           
            ctx.fillStyle = color;
            ctx.fillRect(-23, -11, 46, 22);
           
            ctx.fillStyle = '#87ceeb';
            ctx.fillRect(-10, -9, 20, 18);
           
            ctx.fillStyle = '#111';
            ctx.fillRect(-20, -15, 10, 5);
            ctx.fillRect(-20, 10, 10, 5);
            ctx.fillRect(12, -15, 10, 5);
            ctx.fillRect(12, 10, 10, 5);
           
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(21, -7, 4, 4);
            ctx.fillRect(21, 3, 4, 4);
           
            ctx.restore();
           
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.strokeText(name, x, y - 30);
            ctx.fillText(name, x, y - 30);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTrack();
           
            Object.values(players).forEach(p => {
                const color = p.id === socket.id ? '#00d4ff' : '#ff3366';
                drawCar(p.x, p.y, p.rotation, color, p.name);
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
